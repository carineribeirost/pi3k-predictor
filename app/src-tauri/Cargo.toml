[package]
name = "pi3k-predictor"
version = "0.1.1"
description = "PI3Kα activity predictor"
authors = ["carineribeirost"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
# Desktop only, so no staticlib/cdylib (those are for mobile targets).
name = "pi3k_predictor_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
ruzstd = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
rayon = "1"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-updater = "=2.13.3"
tauri-plugin-process = "=2.4.0"
rust_xlsxwriter = "0.99"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
