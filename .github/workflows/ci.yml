name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"

      - run: npm ci

      # cargo test also regenerates src/bindings; fail if they are stale or end up anywhere else.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generated files are committed
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: npm run typecheck
      - run: npm run lint
      # Prettier findings become annotations, so they show on the run page without opening the log.
      - name: npm run format:check
        shell: bash
        run: |
          set +e
          esc=$(printf '\033')
          out=$(npm run format:check 2>&1 | tr -d '\r' | sed -E "s/${esc}\[[0-9;]*m//g"); code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "$out" | sed -nE 's#^\[warn\] ([^ ]+\.[A-Za-z0-9]+)$#::error file=app/\1::Not formatted; run npm run format#p'
            echo "::error title=prettier::$(echo "$out" | tail -n 20 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$code"
      - run: npm test
