name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"

      - run: npm ci

      # cargo test also regenerates src/bindings; fail if they are stale.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: git diff --exit-code -- src/bindings
        shell: bash
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: npm run typecheck
      - run: npm run lint
      # Prettier findings become annotations, so they show on the run page without opening the log.
      - name: npm run format:check
        shell: bash
        run: |
          npm run format:check 2>&1 | sed -E \
            -e 's#^\[warn\] ([^ ]+\.[A-Za-z0-9]+)$#::error file=app/\1::Not formatted; run npm run format#' \
            -e 's#^\[error\] (.*)$#::error::prettier: \1#'
          exit ${PIPESTATUS[0]}
      - run: npm test
