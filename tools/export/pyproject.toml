[project]
name = "pi3k-export"
version = "0.1.0"
description = "One-off export of the legacy scikit-learn models and training data into app resources"
requires-python = "==3.11.*"
dependencies = [
    "scikit-learn==1.3.2",
    "numpy==1.26.4",
    "scipy==1.11.4",
    "pandas==2.1.4",
    "rdkit==2026.3.6",
    "zstandard==0.23.0",
    "openpyxl==3.1.5",
]

[dependency-groups]
# Only needed to run the legacy pipeline unchanged to capture its predictions as test fixtures.
legacy = [
    "plotly==5.24.1",
    "qsar_ad @ git+https://github.com/carineribeirost/qsar_ad.git@484cc50408e5ab6a32783a2e416a76c1b1cdf420",
]

[tool.uv]
package = false
# qsar_ad's setup.py imports pkg_resources, which newer setuptools no longer ships.
build-constraint-dependencies = ["setuptools<70"]

